<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>UniX Select Semester</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .course-columns {
            display: flex;
            justify-content: center;
            gap: 60px;
            width: 100%;
            max-width: 1300px;
            align-items: flex-start;
            flex-wrap: nowrap;
            background-color: transparent;
        }

        .course-panel {
            background-color: white;
            border: 2px solid black;
            border-radius: 12px;
            width: 520px;
            overflow: hidden;
        }

        .course-panel h3 {
            text-align: center;
            margin: 20px 0 10px 0;
            font-size: 22px;
        }

        .course-list {
            width: 100%;
        }

        .empty-list-message {
            text-align: center;
            padding: 25px 20px 30px 20px;
            color: #555;
        }

        #courseLists {
            background-color: transparent !important;
            max-height: none !important;
            max-width: none !important;
            overflow: visible !important;
            border-radius: 0 !important;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-left">
            <img src="/images/UniX_Logo.png" alt="UniX Logo" style="width: 80px; height: 80px; border-radius: 50px;">
            <h1>Enrolment Dashboard</h1>
        </div>
        <div id="studentProfile" class="header-right"></div>
    </div>

    <button class="back-btn" onclick="location.href='/semesters'">
        <img src="/images/Arrow_left.png" alt="back" style="width: 30px; height: 30px;">
        <span style="vertical-align:middle;">Back to Semesters</span>
    </button>

    <div style="text-align: center; margin-top: 50px;">
        <h2>Enrolments</h2>
        <p id="guideMessage">Choose a course below to view details and enrol.</p>
        <p id="errorMessage" style="display: none; color: rgb(228, 0, 0);">
            Unable to load courses. Please try again.
        </p>
    </div>

    <div style="margin: 30px 40px 100px 40px; display: flex; flex-direction: column; align-items: center;">
        <div id="courseLists" class="course-columns"></div>
    </div>

    <script>
        let refreshPromise = null;

        async function refreshToken() {
            if (refreshPromise) return refreshPromise;

            refreshPromise = fetch('/unix/refresh', {
                method: 'POST',
                credentials: 'include'
            }).then(async res => {
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('accessToken', data.accessToken);
                    return data.accessToken;
                } else {
                    localStorage.clear();
                    window.location.href = '/login';
                    return null;
                }
            });

            return refreshPromise;
        }

        async function fetchWithAuth(url, options = {}) {
            const token = localStorage.getItem('accessToken');

            const res = await fetch(url, {
                ...options,
                headers: {
                    'Authorization': `Bearer ${token}`,
                    ...options.headers
                }
            });

            if (res.status === 401) {
                const newToken = await refreshToken();
                if (!newToken) return null;

                return fetch(url, {
                    ...options,
                    headers: {
                        'Authorization': `Bearer ${newToken}`,
                        ...options.headers
                    }
                });
            }

            return res;
        }

        async function loadProfile() {
            const token = localStorage.getItem('accessToken');
            const semester = localStorage.getItem('selectedSemester');
            const semesterYear = localStorage.getItem('selectedYear');

            if (!token) {
                window.location.href = '/login';
                return;
            }

            try {
                const res = await fetchWithAuth('/unix/me', { method: 'GET' });
                if (!res || !res.ok) throw new Error('Failed to fetch student profile');

                const student = await res.json();
                document.getElementById('studentProfile').innerHTML = `
                    <p>${student.givenNames} ${student.lastname}</p>
                    <p>${student.stdNo}</p>
                    <p>Semester ${semester}, ${semesterYear}</p>`;
            } catch (error) {
                document.getElementById('studentProfile').style.display = 'none';
                console.error(error);
            }
        }

        function renderCourseButtons(courses) {
            if (!courses || courses.length === 0) {
                return `<p class="empty-list-message">No courses in this list.</p>`;
            }

            return `
                <div class="course-list">
                    ${courses.map(course => `
                        <button class="course-item" onclick="onCourseClick('${course.courseId}')">
                            <p><strong>${course.courseId}</strong> ${course.courseName}</p>
                            <p>${course.credits} units</p>
                        </button>
                    `).join('')}
                </div>
            `;
        }

        async function loadCourses() {
            const token = localStorage.getItem('accessToken');
            const semesterId = localStorage.getItem('selectedSemesterId');

            if (!semesterId) {
                window.location.href = '/semesters';
                return;
            }

            if (!token) {
                window.location.href = '/login';
                return;
            }

            try {
                const res = await fetchWithAuth(`/unix/semesters/${semesterId}/courses`, { method: 'GET' });
                if (!res || !res.ok) throw new Error('Failed to fetch courses');

                const courses = await res.json();
                const courseListsDiv = document.getElementById('courseLists');
                const courseGuideMessage = document.getElementById('guideMessage');

                if (courses.length === 0) {
                    courseGuideMessage.textContent = 'No courses available for the selected semester.';
                    return;
                }

                const currentEnrolments = courses.filter(course => course.alreadyEnrolled);
                const availableEnrolments = courses.filter(course => !course.alreadyEnrolled);

                courseListsDiv.innerHTML = `
                    <div class="course-panel">
                        <h3>Current Enrolments</h3>
                        ${renderCourseButtons(currentEnrolments)}
                    </div>

                    <div class="course-panel">
                        <h3>Available Enrolments</h3>
                        ${renderCourseButtons(availableEnrolments)}
                    </div>
                `;
            } catch (error) {
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('guideMessage').style.display = 'none';
                document.getElementById('courseLists').style.display = 'none';
                console.error(error);
            }
        }

        function onCourseClick(courseId) {
            localStorage.setItem('selectedCourseId', courseId);
            location.href = '/course?courseId=' + courseId;
        }

        loadProfile();
        loadCourses();
    </script>
</body>

</html>
