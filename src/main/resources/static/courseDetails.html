<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>UniX Course Details</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .message {
            display: none;
            font-weight: bold;
            margin-top: 10px;
        }

        .message.success {
            color: green;
        }

        .message.error {
            color: red;
        }

        .btn:disabled {
            background-color: #cfcfcf;
            cursor: not-allowed;
            color: #666;
        }

        .detail-value {
            text-align: right;
            max-width: 260px;
            word-wrap: break-word;
        }

        #warningMessage {
            background-color: #fff0d1;
            border-left: 5px solid #b36b00;
            padding: 10px;
            margin-top: 10px;
            margin: 10px auto;
            display: none;
            white-space: pre-wrap;
            max-width: 600px;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-left">
            <img src="/images/UniX_Logo.png" alt="UniX Logo" style="width: 80px; height: 80px; border-radius: 50px;">
            <h1>Enrolment Dashboard</h1>
        </div>
        <div id="studentProfile"></div>
    </div>

    <button class="back-btn" onclick="location.href='/courses'">
        <img src="/images/Arrow_left.png" alt="back" style="width: 30px; height: 30px;">
        <span>Back to Courses</span>
    </button>

    <div style="text-align: center; margin-top: 40px;">
        <h2>Course Details</h2>
        <p id="guideMessage">Review the course details and enrol below.</p>
        <p id="pageMessage" class="message"></p>
        <p id="warningMessage"><strong>Warning: </strong><span id="warningText"></span></p>
    </div>

    <div style="display: flex; justify-content: center; margin-top: 30px; margin-bottom: 100px;">
        <div id="detailsCard" class="details-card" style="display:none;">
            <div class="detail-row">
                <span class="detail-label">Course ID</span>
                <span id="courseId" class="detail-value"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Course Name</span>
                <span id="courseName" class="detail-value"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Credits</span>
                <span id="credits" class="detail-value"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Seats Available</span>
                <span id="seatsAvailable" class="detail-value"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Prerequisites</span>
                <span id="prerequisites" class="detail-value"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Assumed Knowledge</span>
                <span id="assumedKnowledge" class="detail-value"></span>
            </div>

            <div style="text-align: center; margin-top: 25px;">
                <button id="enrolBtn" class="btn" onclick="enrol()">Enrol</button>
            </div>
        </div>
    </div>

    <script>
        let refreshPromise = null;
        let studentNo = null;
        let courseId = null;
        let selectedCourse = null;

        function showMessage(message, type) {
            const messageEl = document.getElementById('pageMessage');
            messageEl.textContent = message;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
        }

        function formatList(items) {
            if (!items || items.length === 0) {
                return 'None';
            }
            return items.join(', ');
        }

        function updateEnrolButton(course) {
            const btn = document.getElementById('enrolBtn');

            if (course.alreadyEnrolled) {
                btn.disabled = true;
                btn.textContent = 'Already Enrolled';
                return;
            }

            if (course.seatsAvailable <= 0) {
                btn.disabled = true;
                btn.textContent = 'No Seats Available';
                return;
            }

            btn.disabled = false;
            btn.textContent = 'Enrol';
        }

        async function refreshToken() {
            if (refreshPromise) return refreshPromise;

            refreshPromise = fetch('/unix/refresh', {
                method: 'POST',
                credentials: 'include'
            }).then(async res => {
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('accessToken', data.accessToken);
                    return data.accessToken;
                } else {
                    localStorage.clear();
                    window.location.href = '/login';
                    return null;
                }
            });

            return refreshPromise;
        }

        async function fetchWithAuth(url, options = {}) {
            const token = localStorage.getItem('accessToken');

            let res = await fetch(url, {
                ...options,
                headers: {
                    'Authorization': `Bearer ${token}`,
                    ...options.headers
                },
                credentials: 'include'
            });

            if (res.status === 401) {
                const newToken = await refreshToken();
                if (!newToken) return null;

                res = await fetch(url, {
                    ...options,
                    headers: {
                        'Authorization': `Bearer ${newToken}`,
                        ...options.headers
                    },
                    credentials: 'include'
                });
            }

            return res;
        }

        async function loadProfile() {
            const res = await fetchWithAuth('/unix/me');

            if (!res || !res.ok) return;

            const student = await res.json();
            studentNo = student.stdNo;

            const sem = localStorage.getItem('selectedSemester');
            const year = localStorage.getItem('selectedYear');

            document.getElementById('studentProfile').innerHTML = `
                <p>${student.givenNames} ${student.lastname}</p>
                <p>${student.stdNo}</p>
                <p>Semester ${sem}, ${year}</p>
            `;
        }

        async function loadCourse() {
            const params = new URLSearchParams(window.location.search);
            courseId = params.get('courseId');
            const semesterId = localStorage.getItem('selectedSemesterId');

            if (!courseId || !semesterId) {
                window.location.href = '/courses';
                return;
            }

            try {
                const res = await fetchWithAuth(`/unix/semesters/${semesterId}/courses`);

                if (!res || !res.ok) {
                    throw new Error('Failed to load course details');
                }

                const courses = await res.json();
                const course = courses.find(c => c.courseId === courseId);

                if (!course) {
                    throw new Error('Course not found');
                }

                selectedCourse = course;

                document.getElementById('courseId').textContent = course.courseId;
                document.getElementById('courseName').textContent = course.courseName;
                document.getElementById('credits').textContent = course.credits;
                document.getElementById('seatsAvailable').textContent = course.seatsAvailable;
                document.getElementById('prerequisites').textContent = formatList(course.prerequisites);
                document.getElementById('assumedKnowledge').textContent = formatList(course.assumedKnowledge);

                if (course.assumedKnowledge && course.assumedKnowledge.length > 0) {
                    document.getElementById('warningText').textContent = 'You haven\'t completed all of the recommended prior courses for this course. We suggest completing them first to help you succeed.';
                    document.getElementById('warningMessage').style.display = 'block';
                }

                updateEnrolButton(course);
                document.getElementById('detailsCard').style.display = 'block';

            } catch (err) {
                document.getElementById('guideMessage').style.display = 'none';
                showMessage('Failed to load course details.', 'error');
            }
        }

        async function enrol() {
            const semesterId = localStorage.getItem('selectedSemesterId');
            const btn = document.getElementById('enrolBtn');

            btn.disabled = true;
            btn.textContent = 'Enrolling...';

            try {
                const res = await fetchWithAuth('/unix/enrol', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        stdNo: studentNo,
                        semesterId: Number(semesterId),
                        courseId: courseId
                    })
                });

                if (!res) {
                    throw new Error('Request failed');
                }

                if (res.ok) {
                    const data = await res.json();

                    let successText = 'Successfully enrolled!';

                    if (data.warningMessage && data.warningMessage.trim() !== '') {
                        document.getElementById('warningText').textContent = 'You have not completed all recommended prior courses. Completing them may improve your understanding of this course.';
                        document.getElementById('warningMessage').style.display = 'block';
                    }

                    showMessage(successText, 'success');

                    if (selectedCourse) {
                        selectedCourse.alreadyEnrolled = true;
                        if (typeof selectedCourse.seatsAvailable === 'number' && selectedCourse.seatsAvailable > 0) {
                            selectedCourse.seatsAvailable -= 1;
                            document.getElementById('seatsAvailable').textContent = selectedCourse.seatsAvailable;
                        }
                        updateEnrolButton(selectedCourse);
                    } else {
                        btn.textContent = 'Enrolled';
                    }

                } else {
                    const errorText = await res.text();
                    showMessage(errorText || 'Failed to enrol.', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Enrol';
                }
            } catch (err) {
                showMessage('Failed to enrol.', 'error');
                btn.disabled = false;
                btn.textContent = 'Enrol';
            }
        }

        loadProfile();
        loadCourse();
    </script>
</body>

</html>
